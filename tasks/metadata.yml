- name: Create temporary directory for metadata generation
  ansible.builtin.tempfile:
    path: "{{ incus_windows_tmp_root }}"
    state: directory
    prefix: "metadata-{{ incus_windows_target }}-"
  register: incus_windows_metadata_tmp

- name: Render Incus metadata.yaml
  ansible.builtin.template:
    src: metadata.yaml.j2
    dest: "{{ incus_windows_metadata_tmp.path }}/metadata.yaml"
    mode: "0644"

- name: Package metadata archive
  ansible.builtin.command:
    argv:
      - tar
      - -C
      - "{{ incus_windows_metadata_tmp.path }}"
      - -cJf
      - "{{ incus_windows_metadata_path }}"
      - metadata.yaml
  changed_when: true

- name: Remove temporary metadata directory
  ansible.builtin.file:
    path: "{{ incus_windows_metadata_tmp.path }}"
    state: absent
