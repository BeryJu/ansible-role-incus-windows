- name: Build Windows image with Incus
  block:
    - name: Initialize build VM
      ansible.builtin.command:
        argv:
          - incus
          - init
          - "{{ incus_windows_build_name }}"
          - --empty
          - --vm
          - -c
          - security.secureboot=false
          - -c
          - limits.cpu={{ incus_windows_build_cpus }}
          - -c
          - limits.memory={{ incus_windows_build_memory }}
          - -c
          - image.os=windows
          - -d
          - root,size={{ incus_windows_root_size }}
      changed_when: true

    # - name: Use NVMe for the build root disk
    #   ansible.builtin.command:
    #     argv:
    #       - incus
    #       - config
    #       - device
    #       - set
    #       - "{{ incus_windows_build_name }}"
    #       - root
    #       - io.bus=nvme
    #   changed_when: true

    - name: Attach Windows ISO
      ansible.builtin.command:
        argv:
          - incus
          - config
          - device
          - add
          - "{{ incus_windows_build_name }}"
          - iso
          - disk
          - source={{ incus_windows_windows_iso_path }}
          - boot.priority=10
      changed_when: true

    - name: Attach Incus agent ISO
      ansible.builtin.command:
        argv:
          - incus
          - config
          - device
          - add
          - "{{ incus_windows_build_name }}"
          - incusagent
          - disk
          - source=agent:config
      changed_when: true

    - name: Allow build VM access to ISO paths
      ansible.builtin.command:
        argv:
          - incus
          - config
          - set
          - "{{ incus_windows_build_name }}"
          - raw.apparmor
          - "-"
        stdin: |-
          {{ incus_windows_windows_iso_path }} rwk,
          {{ incus_windows_unattended_iso_path }} rwk,
      changed_when: true

    - name: Configure QEMU CD-ROM ordering
      ansible.builtin.command:
        argv:
          - incus
          - config
          - set
          - "{{ incus_windows_build_name }}"
          - raw.qemu
          - "-"
        stdin: >-
          -drive file={{ incus_windows_windows_iso_path }},index=0,media=cdrom,if=ide
          -drive file={{ incus_windows_unattended_iso_path }},index=1,media=cdrom,if=ide
      changed_when: true

    - name: Enable CSM for Windows Server 2008
      ansible.builtin.command:
        argv:
          - incus
          - config
          - set
          - "{{ incus_windows_build_name }}"
          - security.csm
          - "true"
      changed_when: true
      when: incus_windows_target_config.security_csm | default(false) | bool

    - name: Add TPM for Windows 11 builds
      ansible.builtin.command:
        argv:
          - incus
          - config
          - device
          - add
          - "{{ incus_windows_build_name }}"
          - tpm
          - tpm
      changed_when: true
      when: incus_windows_target_config.requires_tpm | default(false) | bool

    - name: Boot the VM and spam Enter at the firmware boot prompt
      ansible.builtin.script:
        cmd: >-
          {{ role_path }}/files/start_console_and_spam_enter.py
          {{ incus_windows_build_name }}
          {{ incus_windows_console_timeout_seconds | int }}
          {{ incus_windows_enter_spam_seconds | int }}
      changed_when: true

    - name: Wait for the build VM to report a guest IP
      ansible.builtin.command:
        argv:
          - incus
          - list
          - -f
          - csv,noheader
          - -c
          - "4"
          - "{{ incus_windows_build_name }}"
      register: incus_windows_guest_ip_result
      changed_when: false
      until: incus_windows_guest_ip_result.stdout | trim | length > 0
      retries: "{{ incus_windows_guest_ip_timeout_seconds | int }}"
      delay: 1

    - name: Wait for the build VM to remain stopped for 10 seconds
      ansible.builtin.shell: |
        set -o pipefail
        deadline=$(( $(date +%s) + {{ incus_windows_build_timeout_seconds | int }} ))
        stopped_for=0
        while [ "$(date +%s)" -lt "$deadline" ]; do
          if incus ls -fcsv -cns "{{ incus_windows_build_name }}" | grep -q "^{{ incus_windows_build_name }},STOPPED$"; then
            stopped_for=$((stopped_for + 1))
            if [ "$stopped_for" -ge "{{ incus_windows_stopped_grace_seconds | int }}" ]; then
              exit 0
            fi
          else
            stopped_for=0
          fi
          sleep 1
        done
        echo "VM {{ incus_windows_build_name }} did not remain STOPPED for {{ incus_windows_stopped_grace_seconds | int }} consecutive seconds within {{ incus_windows_build_timeout_seconds | int }} seconds" >&2
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: Look up any existing final image
      ansible.builtin.command:
        argv:
          - incus
          - image
          - list
          - -f
          - csv,noheader
          - -c
          - lF
          - "{{ incus_windows_import_alias }}"
      register: incus_windows_existing_image_list
      changed_when: false

    - name: Resolve existing final image fingerprint
      ansible.builtin.set_fact:
        incus_windows_existing_image_fingerprint: >-
          {{
            (
              incus_windows_existing_image_list.stdout_lines
              | map('split', ',')
              | selectattr('0', 'equalto', incus_windows_import_alias)
              | map('last')
              | list
              | first
            ) | default('')
          }}

    - name: Delete existing final image before publish
      ansible.builtin.command:
        argv:
          - incus
          - image
          - delete
          - "{{ incus_windows_existing_image_fingerprint }}"
      changed_when: true
      when: incus_windows_existing_image_fingerprint | length > 0

    - name: Publish the stopped VM directly into Incus
      ansible.builtin.command:
        argv:
          - incus
          - publish
          - "{{ incus_windows_build_name }}"
          - --alias
          - "{{ incus_windows_import_alias }}"
          - --compression
          - none
          - requirements.cdrom_agent=true
      changed_when: true

    - name: Set the published image description property
      ansible.builtin.command:
        argv:
          - incus
          - image
          - set-property
          - "{{ incus_windows_import_alias }}"
          - description
          - "{{ incus_windows_target_config.description }}"
      changed_when: true
  always:
    - name: Remove temporary ISO repack directory
      ansible.builtin.file:
        path: "{{ incus_windows_repack_tmp.path }}"
        state: absent
      diff: false

    - name: Remove temporary build VM
      ansible.builtin.command:
        argv:
          - incus
          - delete
          - -f
          - "{{ incus_windows_build_name }}"
      changed_when: true
      failed_when: false
