- name: Initialize a VM from the imported image
  ansible.builtin.command:
    argv:
      - incus
      - init
      - "{{ incus_windows_import_alias }}"
      - "{{ incus_windows_instance_name }}"
      - -c
      - security.secureboot=false
  changed_when: true

- name: Use NVMe for the launched VM root disk
  ansible.builtin.command:
    argv:
      - incus
      - config
      - device
      - set
      - "{{ incus_windows_instance_name }}"
      - root
      - io.bus=nvme
  changed_when: true

- name: Attach cloud-init config disk
  ansible.builtin.command:
    argv:
      - incus
      - config
      - device
      - add
      - "{{ incus_windows_instance_name }}"
      - cidata
      - disk
      - source=cloud-init:config
  changed_when: true

- name: Attach Incus agent disk
  ansible.builtin.command:
    argv:
      - incus
      - config
      - device
      - add
      - "{{ incus_windows_instance_name }}"
      - incusagent
      - disk
      - source=agent:config
  changed_when: true

- name: Start the launched VM
  ansible.builtin.command:
    argv:
      - incus
      - start
      - "{{ incus_windows_instance_name }}"
  changed_when: true
