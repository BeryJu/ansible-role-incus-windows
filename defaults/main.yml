incus_windows_target: ""

incus_windows_workspace_dir: /opt/incus-windows

incus_windows_iso_dir: "{{ incus_windows_workspace_dir }}/isos"
incus_windows_output_dir: "{{ incus_windows_output_root }}/win{{ incus_windows_target }}"
incus_windows_output_root: "{{ incus_windows_workspace_dir }}/output"
incus_windows_tmp_root: "{{ incus_windows_workspace_dir }}/tmp"

incus_windows_alt_iso: ""
incus_windows_virtio_iso_override: ""
incus_windows_alt_autounattend: ""
incus_windows_local_dir: ""
incus_windows_oem_dir: "{{ role_path }}/files/oem"
incus_windows_unattend_root: "{{ role_path }}/files/unattend"

incus_windows_build_cpus: 4
incus_windows_build_memory: 8GB
incus_windows_default_root_size: 30GiB
incus_windows_build_timeout_seconds: 7200
incus_windows_guest_ip_timeout_seconds: "{{ incus_windows_build_timeout_seconds }}"
incus_windows_console_timeout_seconds: 30
incus_windows_enter_spam_seconds: 10
incus_windows_stopped_grace_seconds: 10

incus_windows_import_alias: "{{ incus_windows_output_dir | basename }}"
